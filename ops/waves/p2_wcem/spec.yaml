# WCEM -- CEM consumer on the frozen dv3 RSSM.
# PREREG_p2_cem_consumer_20260821, UNLOCKED 23 Aug by the Wave-1 read
# (MECHANISM-CLOSED-NEGATIVE); the prereg was execution-sequenced behind it.
#
# Transcribed from the prereg's Ops line and the FROZEN reader
# (analysis/wcem_read.py) -- never re-derived:
#   EXPECT_ENV_SEED 20260824 / REPEATS 8 / STATES 200 / HORIZON 100
#   VERSION_SUFFIX '_wcem'; EXPECT_CELLS 8
#   FILE_RE  wcem_(cup|finger)_(e1|e4)_seed(3[12])_late.npz
#   DUP_CELLS wcemdup_finger_e1_seed31_late.npz,
#             wcemdup_cup_e4_seed32_late.npz
# The remaining W1-protocol dials are the labeler's OWN defaults and are
# spelled out anyway so the command is auditable without reading argparse:
# --label_every 25 --actions 8 --seed 0 --ref_stride 5 (verified equal to
# the defaults at d0/oracle_labels.py:2607-2656).
#
# --cem_consumer is what sets the five CEM pins (iters 4, samples 64,
# horizon 6, elites 8, std 0.5) via d0/sweep.py::load_config; the reader
# refuses any other values. Do NOT pass them by hand.
#
# --checkpoint is OMITTED on purpose: the labeler defaults to
# <run_logdir>/ckpt and resolves `latest` inside it (oracle_labels.py:1256),
# which IS the registered "R3 LATE" checkpoint. Naming one by hand would
# pin a timestamp that differs per run.
#
# CONCURRENCY -- MEASURED 23 Aug: TWO WCEM PASSES CANNOT SHARE ONE GPU.
# per_gpu 2 was tried first (each pass is its own process, so wavegen's
# packing gives real concurrency for free). Both passes died in
# backend_compile_and_load with
#   INTERNAL: No supported config found for HLO ... %gemm_fusion_dot
#   kind=kCustom "fusion_backend_config":{"kind":"__triton_gemm"}
#   "device_type":"DEVICE_TYPE_INVALID"
#   op_name="jit(fn)/opt/transpose(jvp(con))/mlp/linear0/transpose"
# Isolated with one variable changed at a time on inst 28 (driver 595.84):
#   1 proc, 5 states, --w1_dup_cand  -> rc=0, wrote 5 labeled states
#   2 proc, 5 states, --w1_dup_cand  -> BOTH rc=1, same Triton error
# So it is concurrent Triton GEMM autotuning on ONE device, not the
# dup_cand path and not the state count (the failure is at COMPILE time,
# which happens once regardless of --states). per_gpu is therefore 1
# everywhere. LANES are unaffected: one lane = one card = one process, so a
# 4-lane box still runs 4 passes at once, just not 2 per card.
# NOT worked around with XLA flags (e.g. disabling triton_gemm): that would
# change how a REGISTERED instrument compiles, which is not an ops call.
#
# COST IS UNPRICED. The prereg's "~10 W1-scale passes x (1 + ~1.2 CEM
# overhead)" is explicitly an UNVERIFIED planning estimate and instructs ops
# to re-derive it from the cluster smoke and record it in the bundle NOTES.
# `cells` therefore ships at per_gpu 1; set it from the smoke's measured
# price before submitting that stage, and record the derivation.

wave_id: p2_wcem
paper: paper2
prereg: prereg/PREREG_p2_cem_consumer_20260821.md
notes: >-
  WCEM consumer: cluster smoke (5 states, discarded) -> 2 duplicate-null
  gate passes (2-way) -> 8 cells (cup/finger x e1/e4 x seeds 31-32) on the
  dv3 R3 LATE checkpoints. Smoke+dup on one 1-GPU box; cells on a 4-lane
  box once the smoke prices the pass.

defaults:
  target: vast

kinds:
  wcem_gate: {per_gpu: 1}
  wcem_main: {per_gpu: 5}   # 5 per GPU x 2 GPUs = all 10 passes in ONE round

stages:

  # Cluster smoke: prices the pass and verifies the checkpoint's heads under
  # cem. Writes OUTSIDE wcem_labels/ and deletes itself -- the reader refuses
  # on "no unregistered wcem* files", and a stray smoke npz sitting next to
  # the registered names is exactly that failure.
  - name: smoke
    kind: wcem_gate
    on_failure: abort
    runs:
      - {run_id: wcem_smoke_gate, src: r3_finger_e1_seed31}
    logdir: "wcem_labels"
    cmd: >-
      set -e;
      export XLA_PYTHON_CLIENT_MEM_FRACTION=0.18;
      S="${RUNROOT}/_wcem_smoke"; mkdir -p "$S";
      t0=$(date +%s);
      python -m d0.oracle_labels
      --run_logdir "${RUNROOT}/r3_local/${src}"
      --states 5 --horizon 100 --label_every 25 --actions 8 --seed 0
      --ref_stride 5 --oracle_all
      --w1_repeats 8 --cem_consumer --env_seed 20260824
      --output "$S/smoke_${src}.npz";
      t1=$(date +%s);
      echo "WCEM_SMOKE_SECONDS_5_STATES=$((t1-t0))";
      rm -rf "$S";
      mkdir -p "${RUNROOT}/wcem_labels";
      touch "${RUNROOT}/wcem_labels/WCEM_SMOKE_OK"
    outputs:
      - "wcem_labels"
    done_when:
      - exists: WCEM_SMOKE_OK

  # MAIN STAGE -- the 2 duplicate-null passes AND the 8 registered cells, run
  # TOGETHER. The prereg's chain is smoke -> dups -> cells so that a CRN
  # breakage costs 2 passes instead of 8; the USER waived that ordering on
  # 23 Aug on the ground that under concurrency the cells are nearly free in
  # wall-clock, so a tripped gate costs ~one round either way. The gate is NOT
  # weakened: the reader still refuses the whole read unless both dup passes
  # are exactly zero, and there is no override path.
  #
  # REGIME (Paper-2 approval, 23 Aug, conditions 1-4):
  #   XLA_PYTHON_CLIENT_MEM_FRACTION=0.18 on EVERY pass incl. the smoke
  #   5 tasks per GPU x 2 GPUs = all 10 in one round
  # Measured basis: the working set is NOT 15 GB -- that was the allocator
  # filling the 0.95 cap it was given. One pass runs in 3,876 MiB at 0.18-ish
  # and 1,742 MiB at 0.095; peak ~= fraction*16311 + ~190 MiB overhead, so
  # 5 x (0.18*16311 + 190) = 15,630 of 16,311. CPU is not the limit (~2 cores
  # per pass, 36 cores); GPU util ~12%/pass, so 5/card ~= 60%.
  - name: main
    kind: wcem_main
    on_failure: continue
    runs:
      # lane 0: 1 dup + 4 cells, balanced on dom x dose x seed
      - {run_id: wcemdup_finger_e1_seed31, src: r3_finger_e1_seed31, out: wcemdup_finger_e1_seed31_late, dup: "--w1_dup_cand"}
      - {run_id: wcem_cup_e1_seed31,       src: r3_cup_e1_seed31,    out: wcem_cup_e1_seed31_late,       dup: ""}
      - {run_id: wcem_cup_e4_seed32,       src: r3_cup_e4_seed32,    out: wcem_cup_e4_seed32_late,       dup: ""}
      - {run_id: wcem_finger_e1_seed32,    src: r3_finger_e1_seed32, out: wcem_finger_e1_seed32_late,    dup: ""}
      - {run_id: wcem_finger_e4_seed31,    src: r3_finger_e4_seed31, out: wcem_finger_e4_seed31_late,    dup: ""}
      # lane 1: 1 dup + 4 cells, same balance
      - {run_id: wcemdup_cup_e4_seed32,    src: r3_cup_e4_seed32,    out: wcemdup_cup_e4_seed32_late,    dup: "--w1_dup_cand"}
      - {run_id: wcem_cup_e1_seed32,       src: r3_cup_e1_seed32,    out: wcem_cup_e1_seed32_late,       dup: ""}
      - {run_id: wcem_cup_e4_seed31,       src: r3_cup_e4_seed31,    out: wcem_cup_e4_seed31_late,       dup: ""}
      - {run_id: wcem_finger_e1_seed31,    src: r3_finger_e1_seed31, out: wcem_finger_e1_seed31_late,    dup: ""}
      - {run_id: wcem_finger_e4_seed32,    src: r3_finger_e4_seed32, out: wcem_finger_e4_seed32_late,    dup: ""}
    logdir: "wcem_labels"
    cmd: >-
      W="${RUNROOT}/wcem_labels/WCEM_SMOKE_OK";
      [ -f "$W" ] || { echo "run the wcem smoke first"; exit 1; };
      export XLA_PYTHON_CLIENT_MEM_FRACTION=0.18;
      O="${RUNROOT}/wcem_labels/${out}.npz";
      [ -f "$O" ] && { echo "skip $O (exists)"; exit 0; };
      python -m d0.oracle_labels
      --run_logdir "${RUNROOT}/r3_local/${src}"
      --states 200 --horizon 100 --label_every 25 --actions 8 --seed 0
      --ref_stride 5 --oracle_all
      --w1_repeats 8 ${dup} --cem_consumer --env_seed 20260824
      --output "$O" || { rc=$?; echo "FATAL: labeler failed rc=$rc"; exit $rc; }
    outputs:
      - "wcem_labels"
    done_when:
      - exists: "${out}.npz"

bundle:
  prefix: p2_wcem
  include_stages: [smoke, main]
  cloud_logs:
    - "wcem_*.out"
    - "wcemdup_*.out"
