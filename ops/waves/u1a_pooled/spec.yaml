    outputs:
      - "adapt_ax1uzfq1s${side}_finger_seed${seed}_ckpt500000"
      - "ax1wm_finger_fq1s${side}_seed${seed}"
    inputs:
      - "axis1_finger/q1/side${side}"
      - "axis1_finger/q1/manifest.json"
    done_when:
      - exists: ADAPT_DONE
      - exists: config.yaml
