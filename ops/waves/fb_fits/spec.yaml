# FB / successor-features fits — PREREG_fb_20260817 (+ Amendment 1, 16 Aug).
#
# 16 fits: sides {0,1} x seeds 1-8, run_ids fbwm_finger_q1s{side}_seed{seed}
# exactly as the prereg pins them. The reader consumes these ids and the
# ledger records them, so they are transcribed, never generated by hand.
#
# UPDATES = 500000, NOT a free choice. The prereg's deterministic rule
# (review M20 + review-2 M3): the seed99 smoke runs exactly 20000 updates;
# projected full-fit wall-clock := smoke_wall_s x (500000/20000); if that
# projection > 8 h then updates := 250000, else 500000; no other value is
# admissible. Realized on instance 12 (16 Aug): 20000 updates in 652 s
# (process wall 658 s) => 652 x 25 = 16300 s = 4.53 h < 8 h => 500000. The
# 658 s figure gives 4.57 h, the same branch, so the input ambiguity does not
# reach the outcome.
#
# per_gpu: 2 — user decision 16 Aug, from the smoke's measured footprint
# (~500 MB VRAM and <50% GPU utilisation against a 16311 MiB card). Two fits
# per lane finishes the panel in ~2 rounds instead of 4. Co-residency is safe
# for the science here: dv3/torch GPU training is already not bitwise
# reproducible run-to-run (Midway3 determinism probe, 1 Aug), the prereg
# selfchecks determinism on CPU only, and every registered comparison is
# between fits rather than against a pinned literal.
#
# NOTE the wall-clock consequence, deliberately not "fixed": contention makes
# each fit slower than the 4.53 h projection. That does not touch the updates
# FILL, which the prereg defines on the SOLO smoke projection, not on realized
# co-resident wall-clock.
#
# COMPLETION IS BY COUNTER. fb_fit writes FB_FIT_DONE only on the success path
# (after the ckpt save, no trap), so unlike uncfield_se.sbatch it does not lie
# on failure — but the dual witness is asserted anyway: FB_FIT_PROGRESS carries
# update / total_updates, and a run that stopped short cannot satisfy both.
#
# NOT COVERED by done_when (per the prereg's own bundle spec): the zeroshot
# evals, the 17 embed_probes on ONE GPU model, the device map, and the
# fb_fit_counters.json producer are later stages, not part of this one.

wave_id: fb_fits
paper: paper1
prereg: prereg/PREREG_fb_20260817.md
notes: >-
  16 FB fits (sides 0/1 x seeds 1-8) at 500000 updates on the finger q1
  proprio exports. Two per GPU lane. Instance 12 only.

defaults:
  target: vast

kinds:
  fb_fit: {per_gpu: 2}
  fb_zeroshot: {per_gpu: 2}

stages:

  - name: fit
    kind: fb_fit
    # Independent cells: one failure must not strand the other 15.
    on_failure: continue
    expand:
      side: [0, 1]
      seed: [1, 2, 3, 4, 5, 6, 7, 8]
    run_id: "fbwm_finger_q1s${side}_seed${seed}"
    logdir: "fbwm_finger_q1s${side}_seed${seed}"
    cmd: >-
      MUJOCO_GL=disabled
      CONTROLLABLE_AGENT_ROOT=/workspace/controllable_agent
      /workspace/conda_envs/fb/bin/python -m probing.fb_fit fit
      --data "$RUNROOT/fb_data/finger_q1_side${side}.npz"
      --logdir "$RUNROOT/${run_id}"
      --seed ${seed} --updates 500000
    inputs:
      - "fb_data/finger_q1_side${side}.npz"
      - "fb_data/finger_q1_side${side}.npz.manifest.json"
    outputs:
      - "fbwm_finger_q1s${side}_seed${seed}"
    done_when:
      - exists: FB_FIT_DONE
      - exists: fb_ckpt.pt
      - exists: fb_config.json
      - exists: fb_metrics.json
      - file_contains: {file: FB_FIT_PROGRESS, pattern: "update=500000"}
      - file_contains: {file: FB_FIT_PROGRESS, pattern: "total_updates=500000"}

  # Leg 1 (P-FB1, flagship). Appended to the LIVE lanes while the fits run
  # (dv3_queue_or_add; the supervisor handles late adds -- "QUEUE_RESUME ...
  # late adds found"). Dependency-safe WITHOUT a barrier because lanes are
  # sequential and the lane map is per-seed: lane k runs seeds {k+1, k+5} on
  # both sides for BOTH stages, so a lane's zeroshots sit behind that lane's
  # own fits. per_gpu 2 is what reproduces that map -- it pairs the two sides
  # of one seed into a task exactly as the fit stage does. VERIFY the map
  # after `gen` rather than trusting this comment; a zeroshot that lands on a
  # lane whose fit is elsewhere would run against a half-written ckpt.
  #
  # The guard is the real protection: FB_FIT_DONE is written only on fb_fit's
  # success path, so a fit that died leaves its zeroshot REFUSING (exit 3)
  # instead of writing a json the reader would then have to catch.
  #
  # run_id intentionally repeats the fit run_id -- wavespec scopes its
  # duplicate check per stage (wavespec.py:206), so done_when resolves inside
  # the fit's own run dir and the output lands where fb_zeroshot's own
  # docstring puts it (<logdir>/zeroshot.json). The reader does NOT key on
  # this filename: it keys on dirname(d['ckpt']) via RID_RE, and skips
  # random_floor by tool == 'fb_random_floor_v1'.
  #
  # --task/--device left at parser defaults (finger_turn_hard / cuda), which
  # are the registered values; MUJOCO_GL=disabled is review M18 (a states-only
  # eval must not name a renderer backend).
  - name: zeroshot
    kind: fb_zeroshot
    on_failure: continue
    expand:
      side: [0, 1]
      seed: [1, 2, 3, 4, 5, 6, 7, 8]
    run_id: "fbwm_finger_q1s${side}_seed${seed}"
    logdir: "fbwm_finger_q1s${side}_seed${seed}"
    cmd: >-
      if [ ! -f "$RUNROOT/fbwm_finger_q1s${side}_seed${seed}/FB_FIT_DONE" ];
      then echo "REFUSE fbwm_finger_q1s${side}_seed${seed}: FB_FIT_DONE absent -- fit did not complete"; exit 3; fi;
      MUJOCO_GL=disabled
      CONTROLLABLE_AGENT_ROOT=/workspace/controllable_agent
      /workspace/conda_envs/fb/bin/python -m probing.fb_zeroshot eval
      --ckpt "$RUNROOT/fbwm_finger_q1s${side}_seed${seed}/fb_ckpt.pt"
      --data "$RUNROOT/fb_data/finger_q1_side${side}.npz"
      --seed ${seed}
      --output "$RUNROOT/fbwm_finger_q1s${side}_seed${seed}/zeroshot.json"
    inputs:
      - "fbwm_finger_q1s${side}_seed${seed}/fb_ckpt.pt"
      - "fb_data/finger_q1_side${side}.npz"
    outputs:
      - "fbwm_finger_q1s${side}_seed${seed}/zeroshot.json"
    done_when:
      - exists: zeroshot.json
      - file_contains: {file: zeroshot.json, pattern: '"tool": "fb_zeroshot_v1"'}
      - file_contains: {file: zeroshot.json, pattern: '"n_episodes": 10'}

bundle:
  prefix: fb_fits
  include_stages: [fit]
  cloud_logs:
    - "fbwm_finger_q1s*_seed*.out"
    - "worker_shard*.out"
