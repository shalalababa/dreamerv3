# A2 SCARECROW wave -- PREREG_trackA_scarecrow_20260822 +
# AMENDMENT 1 (20260823): FULL RESTART after the instance-13
# release breach (round 1 of the old per-stage layout was the
# ENTIRE ctrl arm — pooling would have made device == control for
# every cross-arm contrast; the four completed sc_ctrl_s76..79 are
# quarantined _SUPERSEDED_INST13_* on RCC BEFORE any restart pull).
#
# ONE INSTANCE, NON-NEGOTIABLE (the 1-Aug cross-invocation rule):
# the primary and every secondary are cross-arm exact permutations,
# so all 20 runs share one box — and the box is APPARATUS: it is
# not released until the wave is COMPLETE (the ops fourth check).
#
# LANE LAYOUT (Amendment 1 — replaces the per-stage packing that
# caused the arm-pure round): ONE stage, explicit cyclic 4x5 list,
# round r lane l -> arm (r+l) mod 5:
#   - every ROUND holds 4 DISTINCT arms (never arm-pure — a
#     round-wide disturbance cannot load onto one arm),
#   - every LANE runs each arm exactly once (the original balance).
# Declaration order fixes packing; entries 1-4 = round 1, etc.
# Reordering this list silently breaks both properties.
#
# done_when carries the COMMON gates only (single stage); ARM
# identity is enforced by the frozen reader's fatal per-arm pins
# (se_scarecrow_read, #34-reviewed) — the house authority.
#
# DISK (A1 measured 4.6 G/run): 20 x 4.6 ~= 92 G — pull each run to
# RCC as it finishes (verify, then delete instance-side), never an
# end-of-wave drain. replay/ must survive into the bundle.
#
# STALE-CHECKOUT DEFENSE unchanged (preflight var-read check;
# unknown --penalty.* flags kill a stale checkout; BIND-CHECK;
# reader pins).
# Every arm passes the SAME variable set including inert values.
# per_gpu: 1. se_probe passes are NOT part of this wave
# (scripts/se_scarecrow_probe.sbatch, ONE CPU job).

wave_id: a2_scarecrow
paper: track_a
prereg: prereg/PREREG_trackA_scarecrow_20260822.md
notes: >-
  RESTART (Amendment 1): 20 SE runs (cheetah, seeds 76-95): flat
  control, scarecrow (A1-hetero quadruple), strong scarecrow
  (scale 2.0), penalty_mix lambda 0.5 and 2.0. 5e5 steps, ~7 h
  each, ONE instance, 4 lanes x 5 rounds (cyclic arm interleave),
  ~35 h drain.

defaults:
  target: vast

kinds:
  se_run: {per_gpu: 1}

stages:

  - name: a2
    kind: se_run
    on_failure: continue
    runs:
      # cyclic 4x5: round r lane l -> arm (r+l) mod 5;
      # arms: ctrl(76-79) scare(80-83) scare2(84-87) pen1(88-91) pen2(92-95)
      # -- round 1: ctrl scare scare2 pen1 --
      - {run_id: sc_ctrl_s76,   seed: 76, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_scare_s80,  seed: 80, scale: "1.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_scare2_s84, seed: 84, scale: "2.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_pen1_s88,   seed: 88, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "0.5", pgkey: "position", pgthr: "-0.13009691"}
      # -- round 2: scare scare2 pen1 pen2 --
      - {run_id: sc_scare_s81,  seed: 81, scale: "1.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_scare2_s85, seed: 85, scale: "2.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_pen1_s89,   seed: 89, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "0.5", pgkey: "position", pgthr: "-0.13009691"}
      - {run_id: sc_pen2_s92,   seed: 92, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "2.0", pgkey: "position", pgthr: "-0.13009691"}
      # -- round 3: scare2 pen1 pen2 ctrl --
      - {run_id: sc_scare2_s86, seed: 86, scale: "2.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_pen1_s90,   seed: 90, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "0.5", pgkey: "position", pgthr: "-0.13009691"}
      - {run_id: sc_pen2_s93,   seed: 93, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "2.0", pgkey: "position", pgthr: "-0.13009691"}
      - {run_id: sc_ctrl_s77,   seed: 77, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      # -- round 4: pen1 pen2 ctrl scare --
      - {run_id: sc_pen1_s91,   seed: 91, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "0.5", pgkey: "position", pgthr: "-0.13009691"}
      - {run_id: sc_pen2_s94,   seed: 94, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "2.0", pgkey: "position", pgthr: "-0.13009691"}
      - {run_id: sc_ctrl_s78,   seed: 78, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_scare_s82,  seed: 82, scale: "1.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      # -- round 5: pen2 ctrl scare scare2 --
      - {run_id: sc_pen2_s95,   seed: 95, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "True",  pscale: "2.0", pgkey: "position", pgthr: "-0.13009691"}
      - {run_id: sc_ctrl_s79,   seed: 79, scale: "0.35891393", modk: "",         modlo: "0.0",         modhi: "1.0",        pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_scare_s83,  seed: 83, scale: "1.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
      - {run_id: sc_scare2_s87, seed: 87, scale: "2.0",        modk: "position", modlo: "-0.32203162", modhi: "0.19711795", pmix: "False", pscale: "0.0", pgkey: "",         pgthr: "0.0"}
    logdir: "${run_id}"
    cmd: >-
      RUN_ID=${run_id} TASK=dmc_cheetah_run SEED=${seed}
      DISTRACTOR_SCALE=${scale}
      DISTRACTOR_MOD_KEY=${modk} DISTRACTOR_MOD_INDEX=0
      DISTRACTOR_MOD_LO=${modlo} DISTRACTOR_MOD_HI=${modhi}
      PENALTY_MIX=${pmix} PENALTY_SCALE=${pscale}
      PENALTY_GATE_KEY=${pgkey} PENALTY_GATE_INDEX=0
      PENALTY_GATE_THRESHOLD=${pgthr}
      bash scripts/uncfield_se.sbatch
    outputs:
      - "${run_id}"
    done_when:
      - exists: TRAINING_DONE
      - exists: config.yaml
      # common gates only — ARM identity is the frozen reader's
      # fatal per-arm pin block (single-stage shared done_when)
      - file_contains:
          file: ckpt_snapshots/nearest.json
          pattern: '"milestone": 500000,\s+"step": (49\d{4}|[5-9]\d{5})'
      - jsonl_min_lines: {file: scores.jsonl, n: 464}

bundle:
  prefix: a2_scarecrow
  include_stages: [a2]
  cloud_logs: ["sc_*.out"]
