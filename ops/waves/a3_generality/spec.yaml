# A3 GENERALITY LEG (Track A), drafted 30 Aug 2026 -- NOT YET SUBMITTED.
#
# The A1 avoidance design, transplanted to a SECOND environment with a
# re-calibrated planted quadruple. Environment and ramp come from
# prereg/PREREG_a3_calib_amend1_20260830.md s6, which selected
# dmc_finger_spin and SOLVED the ramp endpoints so that BOTH cheetah
# targets are met at once (m-bar 0.16%, amplitude ratio 0.33%).
#
# PIN PROVENANCE (every constant traces to amendment 1 s6):
#   BASESD_PLANTED 0.54193702    Phase-A random-policy inventory, on-site
#   BASESD_N       1.35803102    same inventory, all-key mean
#   MOD_LO   -4.589493315966835  solved under the no-clip gate G6
#   MOD_HI    7.469163326854745  solved under the no-clip gate G6
#   FLAT_SCALE 0.35948428173662794        realized m-bar of the solved ramp
#
# GATE_THRESHOLD IS A READER CONSTANT, NOT A PRODUCER KNOB. Amendment 1
# s6 also pins GATE_THRESHOLD = -0.21752405166625977 (the pilot
# visitation median). That number defines the high-amplitude REGION the
# frozen reader splits occupancy on; it is NOT a training-time gate.
# Like A1, this wave runs with every training-time gate OFF, so the cmd
# below passes GATE_THRESHOLD=0.0 / GATE_KEY= DELIBERATELY. Setting the
# producer's gate to -0.2175 would switch on the Stage-2 gating
# manipulation and destroy the design. Do not "fix" this.
#
# ARM CONSTRUCTION mirrors A1 exactly: hetero carries the mod quadruple
# at scale 1.0; flat carries an EMPTY mod at scale = FLAT_SCALE, so the
# two arms are amplitude-matched and differ only in whether the
# amplitude has a followable spatial gradient. Incentive-immune: the
# flat arm's constant-m-via-scale is exact.
#
# LANE LAYOUT -- BLOCKED, NOT ALTERNATING. `assign_lanes` is i % nlanes.
# At 4 lanes the declaration order below (4 hetero, then 4 flat) gives
#   L0 {het_s210, flat_s214}   L1 {het_s211, flat_s215}
#   L2 {het_s212, flat_s216}   L3 {het_s213, flat_s217}
# i.e. one run of EACH arm per lane. An alternating (A,B,A,B,...) order
# would give L0 {A,A} / L1 {B,B} -- ARM-PURE lanes, confounding arm with
# GPU. `seed` is the FIRST var of every entry because balanced_order
# classes on the first var only. VERIFY arm x lane after `gen`.
# REPLAYED 30 Aug against wavespec.balanced_order -> pair_runs ->
# assign_lanes on this runs list: 4 lanes gives exactly the layout
# above; 2 lanes gives 2 hetero + 2 flat per lane; 8 lanes gives one
# run per lane (A1's own layout). 3 lanes is arm-IMBALANCED (2/1, 1/2,
# 1/1) -- run this wave at 4, 2 or 8 lanes, never 3.
#
# SEEDS 210-217 are disjoint from every registered seed
# ({0, 10-17, 20-51, 52-67, 76-95, 140-147}) and from the calibration
# pilot's 200/201. Arms are never seed-paired. Verified 30 Aug: the
# strings SEED=21x / seed: 21x / "seeds 21x" appear nowhere in prereg/,
# ops/waves/ or STUDY_LEDGER.md.
#
# NO PRODUCER DELTA. Every override is pre-existing in
# scripts/uncfield_se.sbatch, and every one of them is covered by that
# script's BIND-CHECK want() block (verified line-by-line 30 Aug). The
# ONE variable the BIND-CHECK does not cover is TASK, which is why the
# done_when below re-checks `task:` out of the composed config and the
# frozen reader pins it FATALLY.
#
# EXPLICIT INERT OVERRIDES (added 30 Aug at registration).
# DISTRACTOR_THETA / DISAG_HEAD / DISAG_BOOTSTRAP / EXPL_CONFIG are all
# passed at their producer defaults, so the emitted command is
# behaviourally identical -- but each is now BIND-CHECKed against an
# explicit wave value instead of a default. The phi-sweep wave moves
# DISTRACTOR_THETA and the alea wave moved DISAG_HEAD on this same
# producer, so arm identity is stated rather than assumed.
#
# DISK: ~4.4 G/run measured on this producer (ckpt_snapshots dominate at
# ~43 MB per SAVE_EVERY=300 s, no rotation) => ~35 G for 8 runs. Instance
# 3 is 50 G total, so the phisweep runroot MUST be pulled and deleted
# before this wave starts. They cannot coexist.

wave_id: a3_generality
paper: paper5_uncertainty_field
prereg: prereg/PREREG_a3_generality_20260830.md
notes: >-
  8 SE runs (dmc_finger_spin, 5e5 steps, ~7.3 h each, ~58 GPU-h) testing
  whether the A1 avoidance result transplants to a second environment at
  a dose-matched, contrast-matched manipulation. ALL ON ONE INSTANCE.
  BLOCKED declaration order IS the registered lane layout.

defaults:
  target: vast

kinds:
  se_run: {per_gpu: 1}

stages:

  - name: train
    kind: se_run
    on_failure: continue
    runs:
      # -- hetero: the solved mod quadruple at scale 1.0 --
      - {run_id: se_a3gen_het_s210,  seed: 210, modk: position, modlo: "-4.589493315966835", modhi: "7.469163326854745", scale: "1.0", armpat: 'mod_lo:\s+-4\.589493315966835,\s+scale:\s+1\.0'}
      - {run_id: se_a3gen_het_s211,  seed: 211, modk: position, modlo: "-4.589493315966835", modhi: "7.469163326854745", scale: "1.0", armpat: 'mod_lo:\s+-4\.589493315966835,\s+scale:\s+1\.0'}
      - {run_id: se_a3gen_het_s212,  seed: 212, modk: position, modlo: "-4.589493315966835", modhi: "7.469163326854745", scale: "1.0", armpat: 'mod_lo:\s+-4\.589493315966835,\s+scale:\s+1\.0'}
      - {run_id: se_a3gen_het_s213,  seed: 213, modk: position, modlo: "-4.589493315966835", modhi: "7.469163326854745", scale: "1.0", armpat: 'mod_lo:\s+-4\.589493315966835,\s+scale:\s+1\.0'}
      # -- flat: amplitude-matched comparator, no gradient --
      - {run_id: se_a3gen_flat_s214, seed: 214, modk: "",       modlo: "0.0",                 modhi: "1.0",               scale: "0.35948428173662794", armpat: 'mod_lo:\s+0\.0,\s+scale:\s+0\.35948428173662794'}
      - {run_id: se_a3gen_flat_s215, seed: 215, modk: "",       modlo: "0.0",                 modhi: "1.0",               scale: "0.35948428173662794", armpat: 'mod_lo:\s+0\.0,\s+scale:\s+0\.35948428173662794'}
      - {run_id: se_a3gen_flat_s216, seed: 216, modk: "",       modlo: "0.0",                 modhi: "1.0",               scale: "0.35948428173662794", armpat: 'mod_lo:\s+0\.0,\s+scale:\s+0\.35948428173662794'}
      - {run_id: se_a3gen_flat_s217, seed: 217, modk: "",       modlo: "0.0",                 modhi: "1.0",               scale: "0.35948428173662794", armpat: 'mod_lo:\s+0\.0,\s+scale:\s+0\.35948428173662794'}
    logdir: "${run_id}"
    cmd: >-
      RUN_ID=${run_id} TASK=dmc_finger_spin SEED=${seed} STEPS=5e5
      SOURCE_KEY=position BASESD_PLANTED=0.54193702 BASESD_N=1.35803102
      DISTRACTOR_DIM=8 DISTRACTOR_SCALE=${scale} DISTRACTOR_THETA=0.1
      DISTRACTOR_MOD_KEY=${modk} DISTRACTOR_MOD_INDEX=0
      DISTRACTOR_MOD_LO=${modlo} DISTRACTOR_MOD_HI=${modhi}
      GATE_KEY= GATE_INDEX=0 GATE_THRESHOLD=0.0
      DISTRACTOR_GATE_KEY= DISTRACTOR_GATE_INDEX=0 DISTRACTOR_GATE_THRESHOLD=0.0
      EXPL_CONFIG=expl_p2e DISAG_BOOTSTRAP=True DISAG_HEAD=det
      PENALTY_MIX=False PENALTY_SCALE=0.0
      PENALTY_GATE_KEY= PENALTY_GATE_INDEX=0 PENALTY_GATE_THRESHOLD=0.0
      bash scripts/uncfield_se.sbatch
    outputs:
      - "${run_id}"
    # TRAINING_DONE is a LYING MARKER for this producer (touched on the
    # failure path too, uncfield_se.sbatch:237) and the scores.jsonl
    # burst count is phase-dependent. The realized STEP in the milestone
    # snapshot is the invariant test; the row floor is a loose sanity
    # check only. (A1 spec lines 75-78, transcribed.)
    done_when:
      - exists: TRAINING_DONE
      - exists: config.yaml
      - file_contains:
          file: ckpt_snapshots/nearest.json
          pattern: '"milestone": 500000,\s+"step": (49\d{4}|[5-9]\d{5})'
      - file_contains: {file: config.yaml, pattern: 'task:\s+dmc_finger_spin\b'}
      # the finger Phase-A basesd landed (a cheetah 0.0976 leak fails here)
      - file_contains: {file: config.yaml, pattern: 'basesd:\s+0\.54193702\b'}
      # arm identity, PER RUN: hetero must carry the solved ramp AT
      # scale 1.0; flat must carry the inert ramp AT the solved scale.
      # (The previous single alternation matched either arm and so
      # could not catch a swap; keys are adjacent in the composed
      # config's alphabetical flow dump, and \s+ absorbs its line wrap.)
      - file_contains: {file: config.yaml, pattern: '${armpat}'}
      - file_contains: {file: config.yaml, pattern: 'penalty_mix:\s+false'}
      - jsonl_min_lines: {file: scores.jsonl, n: 350}   # finger cadence measured 1202 steps/line in the pilot => ~416 lines at 5e5; 350 keeps margin

bundle:
  prefix: a3_generality
  include_stages: [train]
  cloud_logs: ["se_a3gen_*.out"]
