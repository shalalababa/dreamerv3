# WCEM2 -- fresh-cohort anti-harvest test on the frozen dv3 RSSM.
# PREREG_wcem2_20260823, freeze-committed 1dd7ce97. FRESH WAVE DIR:
# the prereg (review m6) FORBIDS regenerating into ops/waves/p2_wcem/,
# whose untracked generated/ tree is the executed look-1 wave's only
# provenance.
#
# Transcribed from the prereg's Ops line and the FROZEN reader
# (analysis/wcem2_read.py FRESH block) -- never re-derived:
#   env_seed 20260825 / REPEATS 8 / STATES 200 / HORIZON 100
#   VERSION_SUFFIX '_wcem'; cells 24
#   file_re  wcem_(cup|finger)_(e1|e4)_seed(3[3-8])_late.npz
#   dup_cells wcemdup_finger_e1_seed33_late.npz,
#             wcemdup_cup_e4_seed38_late.npz
# Remaining W1-protocol dials are the labeler's OWN defaults, spelled out
# so the command is auditable without reading argparse:
# --label_every 25 --actions 8 --seed 0 --ref_stride 5.
#
# --cem_consumer sets the five CEM pins (iters 4, samples 64, horizon 6,
# elites 8, std 0.5) via d0/sweep.py::load_config; the reader refuses any
# other values. Do NOT pass them by hand.
#
# --checkpoint is OMITTED on purpose: the labeler defaults to
# <run_logdir>/ckpt and resolves `latest` inside it (oracle_labels.py:1256),
# which IS the registered "R3 LATE" checkpoint.
#
# LOGDIR IS `wcem2_labels`, NOT look-1's `wcem_labels`. RCC already holds
# the look-1 cohort in wcem_labels/; pulling a second cohort into that same
# dir would put seed-31/32 files beside seed-33..38 files, and the reader's
# FRESH scan refuses on the FIRST unregistered wcem*.npz it globs. Distinct
# dir = the two cohorts cannot merge by accident on either side.
#
# REGIME (Paper-2 approval 23 Aug, conditions 1-4, carried over by the
# prereg's Execution-regime clause):
#   XLA_PYTHON_CLIENT_MEM_FRACTION=0.18 on EVERY pass incl. the smoke
#   5 tasks per GPU x 2 GPUs = 10 concurrent; 26 passes = 3 rounds
# Measured basis (look-1, bundle p2_wcem_20260823_210000 NOTES): peak ~=
# fraction*16311 + ~190 MiB, so 5 x 3126 = 15,630 of 16,311 MiB. CPU ~2
# cores/pass. per_gpu 2 at the 0.95 DEFAULT is what failed on look-1
# (concurrent Triton GEMM autotuning with no scratch); at 0.18 five share
# a card, executed clean for all 10 look-1 passes.
#
# LAYOUT -- READ BACK FROM THE GENERATED LANE FILES, NOT ASSUMED.
# wavespec.balanced_order keys each run on (stage, kind, FIRST VAR VALUE).
# `run_id` is a spec FIELD, not a var, so the real key here is `src` -- and
# each dup gate SHARES its src with a cell (r3_finger_e1_seed33,
# r3_cup_e4_seed38). Those two srcs therefore form 2-member classes, and
# zip_longest emits the second member of each in a later tier: the cells
# wcem_finger_e1_seed33 and wcem_cup_e4_seed38 are EXILED to the end of the
# run list no matter where they are written. They are written last here so
# the file reads in realized order. Everything else keeps its written order.
# Then pair_runs(per_gpu=5) cuts 6 units and assign_lanes round-robins them:
# lane 0 = units 0,2,4 (15 runs), lane 1 = units 1,3,5 (11 runs), 3 rounds each.
#
# The order below was SEARCHED against that exact transformation so the
# REALIZED layout is balanced (verified by replaying balanced_order/pair_runs/
# assign_lanes, then re-read off the generated .cmds after gen):
#   lane 0 / GPU0: 14 cells -> cup 7 / finger 7, e1 7 / e4 7, seeds 3,2,2,2,3,2
#   lane 1 / GPU1: 10 cells -> cup 5 / finger 5, e1 5 / e4 5, seeds 1,2,2,2,1,2
#   every full round mixed in domain AND dose (each within 1 of even), so a
#   mid-wave box death leaves an axis-BALANCED partial cohort rather than an
#   arm-pure one -- the poolable case, per the instance-13/15 adjudication.
#   ONE dup gate per lane, both in round 1: the CRN gate lands early on both
#   cards, which is the whole point of running dups beside the cells.
# Card cannot alias onto domain or dose, and the primary is a WITHIN-cell
# paired difference (g_cem - g_actor from one pass), so a per-card term
# largely cancels regardless.

wave_id: p2_wcem2
paper: paper2
prereg: prereg/PREREG_wcem2_20260823.md
notes: >-
  WCEM2 fresh cohort: cluster smoke (5 states, discarded) -> 2 duplicate-null
  gate passes + 24 cells (cup/finger x e1/e4 x seeds 33-38) on the dv3 R3
  LATE checkpoints, env_seed 20260825, zero training. Dups and cells run
  TOGETHER under the approved concurrent regime (look-1 precedent).

defaults:
  target: vast

kinds:
  wcem_gate: {per_gpu: 1}
  wcem_main: {per_gpu: 5}

stages:

  # Cluster smoke: verifies the 0.18/5-way regime COMPILES on this box before
  # the 26-pass spend, and re-prices the pass. Writes OUTSIDE wcem2_labels/
  # and deletes itself -- the reader refuses on any unregistered wcem*.npz,
  # and a stray smoke npz beside the registered names is exactly that.
  # Condition 3 of the Paper-2 approval ("smoke first"), carried over.
  - name: smoke
    kind: wcem_gate
    on_failure: abort
    runs:
      - {run_id: wcem2_smoke_gate, src: r3_finger_e1_seed33}
    logdir: "wcem2_labels"
    cmd: >-
      set -e;
      export XLA_PYTHON_CLIENT_MEM_FRACTION=0.18;
      S="${RUNROOT}/_wcem2_smoke"; mkdir -p "$S";
      t0=$(date +%s);
      python -m d0.oracle_labels
      --run_logdir "${RUNROOT}/r3_local/${src}"
      --states 5 --horizon 100 --label_every 25 --actions 8 --seed 0
      --ref_stride 5 --oracle_all
      --w1_repeats 8 --cem_consumer --env_seed 20260825
      --output "$S/smoke_${src}.npz";
      t1=$(date +%s);
      echo "WCEM2_SMOKE_SECONDS_5_STATES=$((t1-t0))";
      rm -rf "$S";
      mkdir -p "${RUNROOT}/wcem2_labels";
      touch "${RUNROOT}/wcem2_labels/WCEM2_SMOKE_OK"
    outputs:
      - "wcem2_labels"
    done_when:
      - exists: WCEM2_SMOKE_OK

  # MAIN -- the 2 duplicate-null passes AND the 24 registered cells together.
  # The prereg's chain is smoke -> dups -> cells so a CRN breakage costs 2
  # passes, not 26; the USER waived that ordering (23 Aug, look-1 precedent
  # re-affirmed for this wave) because under concurrency the cells are nearly
  # free in wall-clock, so a tripped gate costs ~one round either way. The
  # gate is NOT weakened: the reader still refuses the whole read unless both
  # dup passes are EXACTLY zero, and there is no override path (condition 4).
  - name: main
    kind: wcem_main
    on_failure: continue
    runs:
      - {run_id: wcemdup_finger_e1_seed33,          src: r3_finger_e1_seed33, out: wcemdup_finger_e1_seed33_late, dup: "--w1_dup_cand"}
      - {run_id: wcem_cup_e4_seed35,                src: r3_cup_e4_seed35,    out: wcem_cup_e4_seed35_late,    dup: ""}
      - {run_id: wcem_cup_e4_seed36,                src: r3_cup_e4_seed36,    out: wcem_cup_e4_seed36_late,    dup: ""}
      - {run_id: wcem_cup_e1_seed37,                src: r3_cup_e1_seed37,    out: wcem_cup_e1_seed37_late,    dup: ""}
      - {run_id: wcem_finger_e1_seed34,             src: r3_finger_e1_seed34, out: wcem_finger_e1_seed34_late, dup: ""}
      - {run_id: wcemdup_cup_e4_seed38,             src: r3_cup_e4_seed38,    out: wcemdup_cup_e4_seed38_late,    dup: "--w1_dup_cand"}
      - {run_id: wcem_cup_e1_seed34,                src: r3_cup_e1_seed34,    out: wcem_cup_e1_seed34_late,    dup: ""}
      - {run_id: wcem_cup_e1_seed36,                src: r3_cup_e1_seed36,    out: wcem_cup_e1_seed36_late,    dup: ""}
      - {run_id: wcem_finger_e4_seed35,             src: r3_finger_e4_seed35, out: wcem_finger_e4_seed35_late, dup: ""}
      - {run_id: wcem_finger_e1_seed37,             src: r3_finger_e1_seed37, out: wcem_finger_e1_seed37_late, dup: ""}
      - {run_id: wcem_cup_e4_seed37,                src: r3_cup_e4_seed37,    out: wcem_cup_e4_seed37_late,    dup: ""}
      - {run_id: wcem_cup_e1_seed33,                src: r3_cup_e1_seed33,    out: wcem_cup_e1_seed33_late,    dup: ""}
      - {run_id: wcem_finger_e1_seed35,             src: r3_finger_e1_seed35, out: wcem_finger_e1_seed35_late, dup: ""}
      - {run_id: wcem_finger_e4_seed38,             src: r3_finger_e4_seed38, out: wcem_finger_e4_seed38_late, dup: ""}
      - {run_id: wcem_finger_e4_seed33,             src: r3_finger_e4_seed33, out: wcem_finger_e4_seed33_late, dup: ""}
      - {run_id: wcem_finger_e4_seed34,             src: r3_finger_e4_seed34, out: wcem_finger_e4_seed34_late, dup: ""}
      - {run_id: wcem_finger_e1_seed38,             src: r3_finger_e1_seed38, out: wcem_finger_e1_seed38_late, dup: ""}
      - {run_id: wcem_cup_e1_seed35,                src: r3_cup_e1_seed35,    out: wcem_cup_e1_seed35_late,    dup: ""}
      - {run_id: wcem_cup_e4_seed33,                src: r3_cup_e4_seed33,    out: wcem_cup_e4_seed33_late,    dup: ""}
      - {run_id: wcem_finger_e4_seed36,             src: r3_finger_e4_seed36, out: wcem_finger_e4_seed36_late, dup: ""}
      - {run_id: wcem_cup_e4_seed34,                src: r3_cup_e4_seed34,    out: wcem_cup_e4_seed34_late,    dup: ""}
      - {run_id: wcem_finger_e4_seed37,             src: r3_finger_e4_seed37, out: wcem_finger_e4_seed37_late, dup: ""}
      - {run_id: wcem_finger_e1_seed36,             src: r3_finger_e1_seed36, out: wcem_finger_e1_seed36_late, dup: ""}
      - {run_id: wcem_cup_e1_seed38,                src: r3_cup_e1_seed38,    out: wcem_cup_e1_seed38_late,    dup: ""}
      - {run_id: wcem_finger_e1_seed33,             src: r3_finger_e1_seed33, out: wcem_finger_e1_seed33_late, dup: ""}
      - {run_id: wcem_cup_e4_seed38,                src: r3_cup_e4_seed38,    out: wcem_cup_e4_seed38_late,    dup: ""}
    logdir: "wcem2_labels"
    cmd: >-
      W="${RUNROOT}/wcem2_labels/WCEM2_SMOKE_OK";
      [ -f "$W" ] || { echo "run the wcem2 smoke first"; exit 1; };
      export XLA_PYTHON_CLIENT_MEM_FRACTION=0.18;
      O="${RUNROOT}/wcem2_labels/${out}.npz";
      [ -f "$O" ] && { echo "skip $O (exists)"; exit 0; };
      python -m d0.oracle_labels
      --run_logdir "${RUNROOT}/r3_local/${src}"
      --states 200 --horizon 100 --label_every 25 --actions 8 --seed 0
      --ref_stride 5 --oracle_all
      --w1_repeats 8 ${dup} --cem_consumer --env_seed 20260825
      --output "$O" || { rc=$?; echo "FATAL: labeler failed rc=$rc"; exit $rc; }
    outputs:
      - "wcem2_labels"
    done_when:
      - exists: "${out}.npz"

bundle:
  prefix: p2_wcem2
  include_stages: [smoke, main]
  cloud_logs:
    - "wcem_*.out"
    - "wcemdup_*.out"
    - "wcem2_*.out"
