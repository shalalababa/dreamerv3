# P2 Wave 2 -- fresh-cohort TM2 training ON INSTANCES.
# prereg/PREREG_p2_wave2_freshcohort_20260821.md (frozen 74bfeb7a).
#
# WHY NOT RCC: TD-MPC2 has never run on RCC. There is no tdmpc2 conda env and
# no pinned checkout there -- `/scratch/midway3/$USER/conda_envs/` holds only
# `dreamerv3`. On 21 Aug all 32 cells were submitted to Slurm and every one
# died in 1-4 s with `EnvironmentLocationNotFound`. TD-MPC2 lives on instances
# (ops/waves/tm2_bridge_fit2 uses /workspace/conda_envs/tdmpc2), and RCC is for
# CPU / light-GPU / specific-reason work.
#
# The producer is invoked DIRECTLY rather than through scripts/tm2r3.sbatch,
# exactly as tm2_bridge_fit2 does: that sbatch sources scripts/env.sh and
# activates a conda env by RCC path, none of which applies here. Everything the
# sbatch contributes is preserved explicitly -- the pinned TDMPC2_ROOT, the
# separate interpreter, and the same --steps/--early_steps the W1 cohort used.
# The seed guard it also carries is not needed here because the run list below
# IS the registered grid; the guard existed to stop a hand-typed seed.
#
# ONE INSTANCE: this is a replication of a 32-cluster cohort, and the 1-Aug
# cross-site rule says a fresh cohort should not straddle hosts when the thing
# being tested is whether the original number reproduces.
#
# per_gpu is deliberately 1 until MEASURED. tm2_bridge_fit2 runs TD-MPC2 at
# per_gpu 2 ("measured GPU utilisation for this kind leaves room"), but that
# was the OFFLINE recon fit, not this online trainer with an MPPI planner in
# the loop -- a different footprint. Measure a live cell with nvidia-smi and
# raise this to 2 if it fits; do not assume the bridge number transfers.
#
# DISK is not a constraint here: the r3_local cohort measured ~178 MB/run
# (5.7 G for 32), unlike the 4.6 G DreamerV3 SE runs.

wave_id: p2_wave2_vast
paper: paper2
prereg: prereg/PREREG_p2_wave2_freshcohort_20260821.md
notes: >-
  32 fresh TM2 trainings, {cup,finger} x {e1,e4} x seeds 59-66, 100k steps
  with an early snapshot at 25k. ONE INSTANCE. Requires the tdmpc2 env at
  /workspace/conda_envs/tdmpc2 and the pinned checkout at /workspace/tdmpc2.

defaults:
  target: vast

kinds:
  tm2r3_train: {per_gpu: 1}

stages:

  - name: train
    kind: tm2r3_train
    on_failure: continue
    # Explicit runs, not `expand`: the trainer needs --task, which is a
    # FUNCTION of dom (cup -> dmc_cup_catch, finger -> dmc_finger_turn_hard)
    # and cannot be produced by a cartesian expansion.
    #
    # `seed` MUST BE THE FIRST KEY. wavegen runs wavespec.balanced_order()
    # before packing, and that function classes runs by their FIRST VARIABLE
    # ONLY (wavespec.py:369) then deals one per class in rotation. With `dom`
    # first there are exactly two classes, the deal alternates cup/finger, and
    # round-robin over FOUR lanes then puts every cup cell on lanes 0+2 and
    # every finger cell on lanes 1+3 -- DOMAIN PERFECTLY CONFOUNDED WITH GPU.
    # That is what this spec generated on the first attempt. With `seed` first
    # there are eight singleton-per-tier classes, the deal preserves the order
    # below, and each lane draws all four dom x dose conditions twice.
    # A1 and B1 escaped this only because their first key was already `seed`.
    #
    # Within a seed the combo list is rotated by one position, which is what
    # makes the post-balanced_order layout come out even. Verified by
    # replicating balanced_order + assign_lanes, not by assumption.
    runs:
      # -- seed 59: combos rotated by 0 --
      - {seed: 59, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed59}
      - {seed: 59, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed59}
      - {seed: 59, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed59}
      - {seed: 59, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed59}
      # -- seed 60: combos rotated by 1 --
      - {seed: 60, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed60}
      - {seed: 60, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed60}
      - {seed: 60, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed60}
      - {seed: 60, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed60}
      # -- seed 61: combos rotated by 2 --
      - {seed: 61, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed61}
      - {seed: 61, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed61}
      - {seed: 61, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed61}
      - {seed: 61, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed61}
      # -- seed 62: combos rotated by 3 --
      - {seed: 62, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed62}
      - {seed: 62, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed62}
      - {seed: 62, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed62}
      - {seed: 62, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed62}
      # -- seed 63: combos rotated by 4 --
      - {seed: 63, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed63}
      - {seed: 63, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed63}
      - {seed: 63, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed63}
      - {seed: 63, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed63}
      # -- seed 64: combos rotated by 5 --
      - {seed: 64, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed64}
      - {seed: 64, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed64}
      - {seed: 64, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed64}
      - {seed: 64, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed64}
      # -- seed 65: combos rotated by 6 --
      - {seed: 65, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed65}
      - {seed: 65, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed65}
      - {seed: 65, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed65}
      - {seed: 65, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed65}
      # -- seed 66: combos rotated by 7 --
      - {seed: 66, dom: finger, dose: e4, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e4_seed66}
      - {seed: 66, dom: cup, dose: e1, task: dmc_cup_catch, run_id: tm2r3_cup_e1_seed66}
      - {seed: 66, dom: cup, dose: e4, task: dmc_cup_catch, run_id: tm2r3_cup_e4_seed66}
      - {seed: 66, dom: finger, dose: e1, task: dmc_finger_turn_hard, run_id: tm2r3_finger_e1_seed66}
    logdir: "tm2r3/tm2r3_${dom}_${dose}_seed${seed}"
    cmd: >-
      TDMPC2_ROOT=/workspace/tdmpc2/tdmpc2
      /workspace/conda_envs/tdmpc2/bin/python -m probing.tdmpc2_r3_train
      --tdmpc2_root /workspace/tdmpc2/tdmpc2
      --logdir "$RUNROOT/tm2r3/tm2r3_${dom}_${dose}_seed${seed}"
      --task ${task} --dose ${dose} --seed ${seed}
      --steps 100000 --early_steps 25000
    outputs:
      - "tm2r3/tm2r3_${dom}_${dose}_seed${seed}"
    # REALIZED COUNTERS, not the marker. TM2R3_TRAIN_DONE is written by the
    # trainer and is not by itself evidence. ckpt_late.STEP carries the
    # realized step, and it lands BELOW the 100000 target because snapshots
    # happen on episode boundaries every 1000 steps -- the existing r3_local
    # cohort realized 99392 late / 24656 early. A gate demanding exactly
    # 100000 would mark every correct run incomplete.
    done_when:
      - exists: config.json
      - exists: ckpt_early.pt
      - exists: ckpt_late.pt
      - file_contains: {file: ckpt_late.STEP, pattern: '^(9[0-9]{4}|[1-9][0-9]{5,})'}
      - file_contains: {file: ckpt_early.STEP, pattern: '^(2[4-9][0-9]{3}|[3-9][0-9]{4}|[1-9][0-9]{5,})'}

bundle:
  prefix: p2_wave2_vast
  include_stages: [train]
  cloud_logs:
    - "tm2r3_*_seed*.out"
