# SE amendment-2 triggered arms — PREREG_nfi_scale_exhibit_amend2_20260814 §4.
#
# Twelve runs in three arms, transcribed from the registered launch specs.
# Every arm is the Stage-1 queue template (scripts/uncfield_se.sbatch, run
# with bash on a Vast lane exactly as axis1.sbatch is) with ONLY the
# registered delta applied:
#
#   D-only   seeds 10-13   the single delta `--distractor.dim 0`
#   gated    seeds 20-23   the gate triple on BOTH wrappers
#   ungated  seeds 24-27   Stage-1 config verbatim
#
# The pinned constants (SOURCE_KEY=position, BASESD_PLANTED=0.0976,
# BASESD_N=1.215, TASK=dmc_cheetah_run, STEPS=5e5) are the Stage-1 values and
# are NOT re-derived here -- the script defaults them, and re-deriving a
# pinned constant is how a "verbatim" arm stops being verbatim.
#
# SEEDS ARE DISJOINT FROM STAGE-1 BY RUN_ID, NOT BY NUMBER: D-only uses seeds
# 10-13, the same integers Stage-1 used, but writes to se_donly_s1x while
# Stage-1 owns se_cheetah_seed1x. The prereg is explicit that arms are never
# seed-paired, so this is intended; the run_id is what keeps them apart on
# disk, which is why the run_id is spelled out per arm below.
#
# LANE PLACEMENT: one task per lane, and each INSTANCE gets a whole arm.
# Grouping by arm rather than interleaving is what makes an instance's four
# lanes finish together -- D-only carries 8 fewer observation dimensions than
# the other two, so a mixed instance would finish its D-only lanes early and
# sit on them.

wave_id: se_arms
paper: paper5
prereg: prereg/PREREG_nfi_scale_exhibit_amend2_20260814.md
notes: >-
  12 SE arm runs (D-only x4, Stage-2 gated x4, Stage-2 ungated x4) on
  dmc_cheetah_run at 5e5 steps. One arm per instance, one run per lane.

defaults:
  target: vast

kinds:
  se_run: {per_gpu: 1}

stages:

# COMPLETION PREDICATE, corrected 2026-08-16 after the instance-1 disk-full.
# `TRAINING_DONE` IS A LYING MARKER for this producer: uncfield_se.sbatch does
#   TRAIN_RC=0; wait "$TRAIN_PID" || TRAIN_RC=$?
#   touch "$LOGDIR/TRAINING_DONE"
# so the marker is touched unconditionally, on the failure path too. All four
# D-only runs died at ~50% (248k-260k of 5e5 steps) when the disk filled, and
# all four carried TRAINING_DONE. The original `n: 100` bound passed them.
#
# CORRECTED AGAIN 2026-08-16 pm. The n:496 bound above was itself wrong --
# right instinct (counter, not marker), wrong counter. scores.jsonl is
# written in BURSTS of 16 rows (one per eval episode) every ~16001 steps,
# so 496 = 31 bursts and the burst count depends on where the stop step
# falls relative to an eval boundary. se_donly_s10 resumed from a slightly
# earlier checkpoint after the disk-full, ended at agent step 497744, and
# missed its 31st boundary -> 480 rows (30 bursts) while being FULLY
# trained: clean rc=0 exit, all five milestone snapshots, monotonic scores
# with zero duplicates and no interior gaps.
#
# The invariant is the STEP, not the row count. Measured across all 12 SE
# runs the realized final-milestone step is 494240..499552 (s10 = 494704,
# mid-pack -- se_gate_s23 is lower), whereas the disk-full truncation sat
# near 250000. So the predicate below asserts the 500000-milestone
# snapshot exists at a realized step >= 490000, and keeps a LOOSE row
# floor (464 = 29 bursts) purely as a sanity check, not as the test.

  # -- D-only: the single registered delta is --distractor.dim 0 -----------
  # Needs a per-run se_probe pass afterwards (final checkpoint, frozen
  # defaults) -- amendment §4. That is a separate stage, not folded in here,
  # because the probe must see a FINISHED run.
  - name: donly
    kind: se_run
    on_failure: continue
    expand:
      seed: [10, 11, 12, 13]
    run_id: "se_donly_s${seed}"
    logdir: "se_donly_s${seed}"
    cmd: >-
      RUN_ID=se_donly_s${seed} TASK=dmc_cheetah_run SEED=${seed}
      DISTRACTOR_DIM=0
      bash scripts/uncfield_se.sbatch
    outputs:
      - "se_donly_s${seed}"
    done_when:
      - exists: TRAINING_DONE
      - exists: config.yaml
      # THE completion counter (see the note above stages): the final
      # milestone snapshot exists at a realized step >= 490000.
      - file_contains:
          file: ckpt_snapshots/nearest.json
          pattern: '"milestone": 500000,\s+"step": (49\d{4}|[5-9]\d{5})'
      # Loose sanity floor only -- 29 eval bursts. NOT a completion test.
      - jsonl_min_lines: {file: scores.jsonl, n: 464}

  # -- Stage-2 gated: the gate triple on BOTH wrappers ---------------------
  - name: gated
    kind: se_run
    on_failure: continue
    expand:
      seed: [20, 21, 22, 23]
    run_id: "se_gate_s${seed}"
    logdir: "se_gate_s${seed}"
    cmd: >-
      RUN_ID=se_gate_s${seed} TASK=dmc_cheetah_run SEED=${seed}
      DISTRACTOR_GATE_KEY=position DISTRACTOR_GATE_INDEX=0
      DISTRACTOR_GATE_THRESHOLD=-0.13009691
      GATE_KEY=position GATE_INDEX=0 GATE_THRESHOLD=-0.13009691
      bash scripts/uncfield_se.sbatch
    outputs:
      - "se_gate_s${seed}"
    done_when:
      - exists: TRAINING_DONE
      - exists: config.yaml
      # THE completion counter (see the note above stages): the final
      # milestone snapshot exists at a realized step >= 490000.
      - file_contains:
          file: ckpt_snapshots/nearest.json
          pattern: '"milestone": 500000,\s+"step": (49\d{4}|[5-9]\d{5})'
      # Loose sanity floor only -- 29 eval bursts. NOT a completion test.
      - jsonl_min_lines: {file: scores.jsonl, n: 464}

  # -- Stage-2 ungated: Stage-1 config verbatim ----------------------------
  - name: ungated
    kind: se_run
    on_failure: continue
    expand:
      seed: [24, 25, 26, 27]
    run_id: "se_ungate_s${seed}"
    logdir: "se_ungate_s${seed}"
    cmd: >-
      RUN_ID=se_ungate_s${seed} TASK=dmc_cheetah_run SEED=${seed}
      bash scripts/uncfield_se.sbatch
    outputs:
      - "se_ungate_s${seed}"
    done_when:
      - exists: TRAINING_DONE
      - exists: config.yaml
      # THE completion counter (see the note above stages): the final
      # milestone snapshot exists at a realized step >= 490000.
      - file_contains:
          file: ckpt_snapshots/nearest.json
          pattern: '"milestone": 500000,\s+"step": (49\d{4}|[5-9]\d{5})'
      # Loose sanity floor only -- 29 eval bursts. NOT a completion test.
      - jsonl_min_lines: {file: scores.jsonl, n: 464}

bundle:
  prefix: se_arms
  include_stages: [donly, gated, ungated]
  cloud_logs:
    - "se_donly_s*.out"
    - "se_gate_s*.out"
    - "se_ungate_s*.out"
